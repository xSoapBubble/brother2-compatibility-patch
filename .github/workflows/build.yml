name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit public tree
        run: python tools/audit_public_tree.py
      - name: Build from source
        run: python tools/build.py
      - name: Test installer on synthetic data
        run: python tools/check.py
      - name: Verify two independent source builds
        run: python tools/reproducibility.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brother-compatibility-patch
          if-no-files-found: error
          path: |
            build/dist/*.zip
            build/dist/SHA256SUMS.txt
            build/build-info.json
            build/check-results.json
            build/reproducibility/result.json
