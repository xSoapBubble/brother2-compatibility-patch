name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit public tree
        run: python tools/audit_public_tree.py
      - name: Build from source
        run: python tools/build.py
      - name: Test installer on synthetic data
        run: python tools/check.py
      - name: Verify two independent source builds
        run: python tools/reproducibility.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brother-compatibility-patch
          if-no-files-found: error
          path: |
            build/dist/*.zip
            build/dist/SHA256SUMS.txt
            build/build-info.json
            build/check-results.json
            build/reproducibility/result.json
