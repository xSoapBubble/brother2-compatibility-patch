; Brother's Texture2 pixel conversion supports only 8-bit and 16-bit textures.
; Keep native game rendering depth and expose standard 16-bit RGB(A) formats.
DesktopColorDepth = 16
RenderColorDepth = app
SupportedTextureFormats = R5G6B5, X1R5G5B5, A1R5G5B5, A4R4G4B4
FullscreenMode = borderless
DisplayResolution = desktop
MouseSensitivity = native
; Preserve original alpha in the game shadow textures.
ColorKeyMethod = native

; Preserve video resources across rapid fullscreen focus changes.
AltTabFix = keepvidmem(1)
